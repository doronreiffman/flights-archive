AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Archives the Ben Gurion flight board (data.gov.il flydata) every 2 minutes into a write-once S3 bucket.

Parameters:
  UserAgent:
    Type: String
    Description: Names the project and a contact, e.g. "flights-archive/0.1 (+https://github.com/you/repo; you@example.org)"
    MinLength: 10
    # Must carry a +https:// project URL and an email, or the deploy is refused. A value with
    # spaces must be inner-quoted on the sam deploy command line or it is silently cut short.
    AllowedPattern: '.*\+https?://.*@.*'
    ConstraintDescription: must contain "+https://<project url>" and a contact email address
  HealthcheckUrl:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: healthchecks.io ping URL, e.g. https://hc-ping.com/<uuid>
  AlertEmail:
    Type: String
    Description: Gets an email when board versions are being lost or data.gov.il has blocked the collector.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Start DISABLED to test the stack without calling data.gov.il every 2 minutes; redeploy with ENABLED to go live.
  RetentionDays:
    Type: Number
    Default: 3650
    MinValue: 1
    Description: Object Lock (governance mode) retention for each snapshot.

Resources:
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            Prefix: state/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: collector.handler.handler
      Runtime: python3.13
      MemorySize: 256
      # 20 s status check + 45 s download + S3 + 10 s ping, and still under the 2-min schedule
      Timeout: 100
      # Scheduler invokes asynchronously; Lambda would otherwise retry a failed run twice.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      LoggingConfig:
        LogGroup: !Ref CollectorLogs
      Environment:
        Variables:
          BUCKET: !Ref ArchiveBucket
          USER_AGENT: !Ref UserAgent
          HEALTHCHECK_URL: !Ref HealthcheckUrl
          RETENTION_DAYS: !Ref RetentionDays
      Policies:
        - Statement:
            # Snapshots and their receipts: written once, locked, never read back by the collector.
            - Sid: WriteOnceArchive
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectRetention
              Resource:
                - !Sub "${ArchiveBucket.Arn}/raw/*"
                - !Sub "${ArchiveBucket.Arn}/receipts/*"
            - Sid: ReadWriteState
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${ArchiveBucket.Arn}/state/*"
            # Without ListBucket, S3 answers a missing state file with 403 instead of 404,
            # and an s3:prefix condition doesn't apply to GetObject, so this stays unconditional.
            - Sid: ListBucketSoMissingKeyIs404
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ArchiveBucket.Arn
      Events:
        EveryTwoMinutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(2 minutes)
            State: !Ref ScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0

  # Created before the function, under its own name, so the first scheduled run
  # can't race CloudFormation by auto-creating /aws/lambda/<name>.
  CollectorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/collector"
      RetentionInDays: 30

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Counts runs that wrote a receipt (stored or unchanged): their summary line holds "receipt": "receipts/...".
  # Single-quoted so YAML keeps the backslashes; tests/test_alarms.py ties the pattern to the logged line.
  ReceiptFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CollectorLogs
      FilterPattern: '"\"receipt\": \"receipts/"'
      MetricTransformations:
        - MetricNamespace: flights-archive
          MetricName: Receipts
          MetricValue: "1"
          DefaultValue: 0

  # Counts runs that hit a block, and every latched run after it; tests/test_alarms.py ties it to the logged line.
  BlockedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CollectorLogs
      FilterPattern: '"BLOCKED:"'
      MetricTransformations:
        - MetricNamespace: flights-archive
          MetricName: BlockedRuns
          MetricValue: "1"
          DefaultValue: 0

  MissedRefreshAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "No board download for 35 minutes: at least one 15-minute board version was missed. Read /flights-archive/collector; a BLOCKED line means stop and ask (docs/operations.md, If it's blocked)."
      Namespace: flights-archive
      MetricName: Receipts
      Statistic: Sum
      # Five-minute periods each hold two or three runs' lines, so no datapoint is missing while the collector runs
      # and CloudWatch never reaches back past the 35 minutes (one-minute periods left every other minute empty).
      Period: 300
      EvaluationPeriods: 7
      DatapointsToAlarm: 7
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # A minute with no log lines counts as one without a receipt, so a collector that stops running sets it off too.
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  BlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "data.gov.il blocked the collector and it has stopped calling. Stop and ask; never work around a block (docs/operations.md, If it's blocked)."
      Namespace: flights-archive
      MetricName: BlockedRuns
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

Outputs:
  ArchiveBucketName:
    Value: !Ref ArchiveBucket
  CollectorFunctionName:
    Value: !Ref CollectorFunction
